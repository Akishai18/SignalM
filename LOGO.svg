<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="url(#gradient)" stroke-width="3"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Signal Wave Pattern -->
  <g filter="url(#glow)">
    <!-- Wave 1 - Calm -->
    <path d="M 40 100 Q 50 90, 60 100 T 80 100" stroke="#10b981" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- Wave 2 - Elevated -->
    <path d="M 80 100 Q 90 80, 100 100 T 120 100" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Wave 3 - Crisis -->
    <path d="M 120 100 Q 130 60, 140 100 T 160 100" stroke="#ef4444" stroke-width="3.5" fill="none" opacity="0.9"/>

    <!-- Connecting line -->
    <line x1="40" y1="100" x2="160" y2="100" stroke="#475569" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Letter S -->
  <text x="50" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGradient)" filter="url(#glow)">S</text>

  <!-- Letter M -->
  <text x="105" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGradient)" filter="url(#glow)">M</text>

  <!-- Subtitle -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="3">MARKET SIGNALS</text>
</svg>
