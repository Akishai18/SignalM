name: Daily Data Refresh

on:
  schedule:
    # 3 AM EST = 8 AM UTC, weekdays only
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI (Actions tab → Run workflow)

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to git push updated data files
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn yfinance

      - name: Run refresh pipeline
        run: python scripts/refresh_pipeline.py

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "SignalM Bot"
          git config user.email "bot@signalm.app"
          git add data/ regime_results/ precomputed/
          if git diff --cached --quiet; then
            echo "No changes to commit (holiday/weekend)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger `on: push` workflows, so the
  # API deploy (which bakes the fresh data into the image) is called directly
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy_api.yml
    secrets: inherit
