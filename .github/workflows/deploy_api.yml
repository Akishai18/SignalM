name: Deploy API to Lightsail

# Builds the Docker image, pushes it to ECR, and deploys it to the Lightsail
# container service (created once by aws-lightsail-setup.sh).
#
# Triggered by:
#   - pushes to main (code or data changes)
#   - the daily_refresh workflow via workflow_call — required because pushes
#     made with GITHUB_TOKEN do NOT fire `on: push` workflows
#   - manual runs from the Actions tab
#
# Requires repo variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY
# See docs/AWS_DEPLOY.md for the one-time setup.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write   # OIDC auth to AWS
  contents: read

env:
  ECR_REPOSITORY: signalm-api
  SERVICE_NAME: signalm-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false

    steps:
      # Always deploy the tip of main: when called from daily_refresh, the
      # triggering commit predates the data commit the refresh job just pushed
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG=$(git rev-parse --short HEAD)
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lightsail
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          cat > /tmp/containers.json <<EOF
          {
            "api": {
              "image": "$IMAGE",
              "ports": { "8080": "HTTP" },
              "environment": {
                "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
                "SUPABASE_SERVICE_KEY": "${{ secrets.SUPABASE_SERVICE_KEY }}",
                "PYTHONUNBUFFERED": "1"
              }
            }
          }
          EOF
          cat > /tmp/endpoint.json <<EOF
          {
            "containerName": "api",
            "containerPort": 8080,
            "healthCheck": { "path": "/", "successCodes": "200" }
          }
          EOF
          aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers file:///tmp/containers.json \
            --public-endpoint file:///tmp/endpoint.json

      - name: Wait for deployment to go live
        run: |
          for i in $(seq 1 60); do
            STATE=$(aws lightsail get-container-services --service-name "$SERVICE_NAME" \
              --query 'containerServices[0].state' --output text)
            echo "state: $STATE"
            if [ "$STATE" = "RUNNING" ]; then exit 0; fi
            if [ "$STATE" = "FAILED" ]; then exit 1; fi
            sleep 15
          done
          echo "Timed out waiting for deployment to stabilize"
          exit 1
